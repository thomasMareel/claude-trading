<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude trading automatisé</title>
<meta name="description" content="Relevés du banc d'essai : Claude trade seul 100 USDT face à un repère buy-and-hold, sous un protocole de mesure figé.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    color-scheme: light;
    --page:      #f9f9f7;
    --surface:   #fcfcfb;
    --surface-2: #f2f2ef;
    --ink:       #0b0b0b;
    --ink-2:     #52514e;
    --muted:     #898781;
    --grid:      #e1e0d9;
    --baseline:  #c3c2b7;
    --border:    rgba(11,11,11,.10);
    --accent:    #2a78d6;          /* serie 1 : Claude, et l'accent d'interface */
    --accent-soft: rgba(42,120,214,.10);
    --serie-2:   #eb6834;          /* serie 2 : le repere */
    --good:      #0ca30c;  --good-text: #006300;
    --warning:   #fab219;
    --serious:   #ec835a;
    --critical:  #d03b3b;
    --shadow:    0 1px 2px rgba(11,11,11,.05), 0 8px 24px -16px rgba(11,11,11,.25);
    --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
    --body:    "IBM Plex Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono:    "IBM Plex Mono", "Cascadia Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19; --surface-2: #222220;
      --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --baseline: #383835; --border: rgba(255,255,255,.10);
      --accent: #3987e5; --accent-soft: rgba(57,135,229,.16); --serie-2: #d95926;
      --good: #0ca30c; --good-text: #0ca30c;
      --shadow: 0 1px 2px rgba(0,0,0,.5), 0 8px 24px -16px rgba(0,0,0,.8);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --surface-2: #222220;
    --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --baseline: #383835; --border: rgba(255,255,255,.10);
    --accent: #3987e5; --accent-soft: rgba(57,135,229,.16); --serie-2: #d95926;
    --good: #0ca30c; --good-text: #0ca30c;
    --shadow: 0 1px 2px rgba(0,0,0,.5), 0 8px 24px -16px rgba(0,0,0,.8);
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { background: var(--page); }
  body { margin: 0; background: var(--page); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
  a { color: var(--accent); }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .wrap { max-width: 64rem; margin: 0 auto; padding: 1rem 1rem 4rem; display: flex; flex-direction: column; gap: 1.75rem; }
  @media (min-width: 48rem) { .wrap { padding: 2rem 1.5rem 5rem; gap: 2.25rem; } }

  h1, h2, h3 { font-family: var(--display); margin: 0; line-height: 1.15; text-wrap: balance; letter-spacing: -.01em; }
  h1 { font-size: clamp(1.6rem, 4.5vw, 2.2rem); font-weight: 700; }
  h2 { font-size: 1.2rem; font-weight: 700; }
  h3 { font-size: 1rem; font-weight: 600; }
  p { margin: 0; max-width: 68ch; }
  .eyebrow { font-family: var(--mono); font-size: .7rem; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
  .muted { color: var(--muted); } .ink2 { color: var(--ink-2); }
  .mono { font-family: var(--mono); font-size: .86em; }
  .num { font-variant-numeric: tabular-nums; }
  .small { font-size: .85rem; }

  /* ---------- header ---------- */
  header { display: flex; flex-direction: column; gap: .8rem; }
  .titlebar { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; }
  .theme { border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: .3rem .7rem; font-size: .8rem; cursor: pointer; white-space: nowrap; }
  .strip { display: flex; flex-wrap: wrap; gap: .45rem .6rem; align-items: center; }
  .pill { display: inline-flex; align-items: center; gap: .35rem; border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: .18rem .6rem; font-size: .8rem; color: var(--ink-2); white-space: nowrap; }
  .pill .dot { width: .5rem; height: .5rem; border-radius: 50%; background: var(--muted); }
  .pill.good .dot { background: var(--good); } .pill.crit .dot { background: var(--critical); } .pill.warn .dot { background: var(--warning); }
  .pill b { color: var(--ink); font-weight: 600; }

  /* ---------- banners ---------- */
  .banner { border: 1px solid var(--border); border-left: 4px solid var(--accent); background: var(--surface); border-radius: 6px; padding: .9rem 1.1rem; display: flex; flex-direction: column; gap: .3rem; box-shadow: var(--shadow); }
  .banner.crit { border-left-color: var(--critical); } .banner.warn { border-left-color: var(--warning); }
  .banner h3 { font-size: .98rem; } .banner p { font-size: .9rem; color: var(--ink-2); }
  .banner code { font-family: var(--mono); font-size: .8em; background: var(--surface-2); padding: .05em .35em; border-radius: 3px; }

  /* ---------- KPI tiles ---------- */
  .kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: .5rem; }
  @media (min-width: 40rem) { .kpis { grid-template-columns: repeat(3, 1fr); } }
  @media (min-width: 64rem) { .kpis { grid-template-columns: repeat(6, 1fr); } }
  .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: .8rem .9rem; display: flex; flex-direction: column; gap: .15rem; min-width: 0; }
  .kpi .lbl { font-size: .74rem; color: var(--muted); }
  .kpi .val { font-size: 1.45rem; font-weight: 600; letter-spacing: -.01em; line-height: 1.15; overflow-wrap: anywhere; }
  .kpi .sub { font-size: .76rem; color: var(--ink-2); }
  .up { color: var(--good-text); } .down { color: var(--critical); }

  /* ---------- sections and cards ---------- */
  section { display: flex; flex-direction: column; gap: .9rem; }
  .sechead { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: .4rem 1rem; border-top: 2px solid var(--ink); padding-top: .7rem; }
  .sechead p { font-size: .85rem; color: var(--muted); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 1rem 1.1rem; }
  .empty { color: var(--muted); font-size: .9rem; padding: 1.2rem 0; text-align: center; }

  /* ---------- charts ---------- */
  .chart { display: flex; flex-direction: column; gap: .5rem; }
  .chart-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: .3rem .8rem; }
  .legend { display: flex; flex-wrap: wrap; gap: .3rem 1rem; font-size: .8rem; color: var(--ink-2); }
  .legend span::before { content: ""; display: inline-block; width: 16px; height: 2px; vertical-align: middle; margin-right: .4rem; background: var(--c); border-radius: 1px; }
  .plot { position: relative; width: 100%; }
  .plot svg { display: block; width: 100%; height: auto; overflow: visible; }
  .plot text { font-family: var(--mono); font-size: 11px; fill: var(--muted); }
  .plot .grid line { stroke: var(--grid); stroke-width: 1; }
  .plot .axis line { stroke: var(--baseline); stroke-width: 1; }
  .plot .line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .plot .area { opacity: .10; }
  .plot .end-label { fill: var(--ink-2); font-weight: 500; }
  .plot .xhair { stroke: var(--baseline); stroke-width: 1; }
  .plot .ref { stroke: var(--baseline); stroke-width: 1; }
  .tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; box-shadow: var(--shadow); padding: .45rem .6rem; font-size: .78rem; color: var(--ink-2); min-width: 9rem; z-index: 2; display: none; }
  .tip .t { font-family: var(--mono); font-size: .72rem; color: var(--muted); margin-bottom: .25rem; }
  .tip .row { display: flex; align-items: center; gap: .45rem; }
  .tip .row i { display: inline-block; width: 12px; height: 2px; background: var(--c); }
  .tip .row b { color: var(--ink); font-weight: 600; margin-left: auto; font-variant-numeric: tabular-nums; }
  details.tbl summary { cursor: pointer; font-size: .8rem; color: var(--muted); }

  /* ---------- tables ---------- */
  .tablewrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); }
  table { border-collapse: collapse; width: 100%; font-size: .85rem; min-width: 30rem; }
  th, td { text-align: left; padding: .5rem .75rem; border-bottom: 1px solid var(--grid); vertical-align: top; }
  thead th { font-family: var(--mono); font-size: .68rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 500; border-bottom: 1px solid var(--baseline); }
  tbody tr:last-child td { border-bottom: 0; }
  td.n, th.n { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; font-size: .82rem; }
  td.m { font-family: var(--mono); font-size: .8rem; white-space: nowrap; }

  /* ---------- journal ---------- */
  .filters { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
  .filters select, .filters input[type=search] { font: inherit; font-size: .85rem; color: var(--ink); background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: .35rem .55rem; }
  .filters label { font-size: .85rem; color: var(--ink-2); display: inline-flex; align-items: center; gap: .35rem; }
  .cycle { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .cycle-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: .3rem .8rem; padding: .7rem 1rem; background: var(--surface-2); border-bottom: 1px solid var(--grid); }
  .cycle-head .when { font-family: var(--mono); font-size: .78rem; color: var(--ink-2); }
  .cycle-head .tag { font-family: var(--mono); font-size: .68rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
  .view { padding: .6rem 1rem; font-size: .9rem; color: var(--ink-2); font-style: italic; border-bottom: 1px solid var(--grid); }
  .dec { display: grid; grid-template-columns: auto 1fr; gap: .25rem .8rem; padding: .7rem 1rem; border-bottom: 1px solid var(--grid); align-items: start; }
  .dec:last-child { border-bottom: 0; }
  .dec .sym { font-family: var(--mono); font-size: .8rem; font-weight: 500; white-space: nowrap; padding-top: .15rem; }
  .dec .line1 { display: flex; flex-wrap: wrap; gap: .3rem .5rem; align-items: center; }
  .badge { font-family: var(--mono); font-size: .68rem; text-transform: uppercase; letter-spacing: .09em; padding: .12rem .45rem; border-radius: 3px; border: 1px solid var(--border); color: var(--ink-2); white-space: nowrap; }
  .badge.buy { border-color: var(--good); color: var(--good-text); }
  .badge.sell { border-color: var(--serious); color: var(--ink); }
  .badge.refus { background: rgba(250,178,25,.18); border-color: var(--warning); color: var(--ink); }
  .badge.forced { background: var(--surface-2); }
  .bias { font-family: var(--mono); font-size: .72rem; color: var(--ink-2); }
  .dec .why { grid-column: 2; font-size: .9rem; color: var(--ink-2); }
  .dec .refused { grid-column: 2; font-size: .85rem; color: var(--ink); background: rgba(250,178,25,.12); border-left: 3px solid var(--warning); padding: .3rem .6rem; border-radius: 3px; }
  .dec details { grid-column: 2; font-size: .82rem; color: var(--ink-2); }
  .dec details summary { cursor: pointer; color: var(--muted); font-size: .78rem; }
  .dec details p { white-space: pre-wrap; margin-top: .3rem; }
  .more { align-self: center; border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: .4rem 1rem; cursor: pointer; font-size: .85rem; }

  /* ---------- metrics lists ---------- */
  .grid2 { display: grid; grid-template-columns: 1fr; gap: .75rem; }
  @media (min-width: 52rem) { .grid2 { grid-template-columns: 1fr 1fr; } }
  dl.kv { margin: 0; display: grid; grid-template-columns: 1fr auto; gap: .3rem 1rem; font-size: .88rem; }
  dl.kv dt { color: var(--ink-2); } dl.kv dd { margin: 0; font-family: var(--mono); font-size: .82rem; text-align: right; color: var(--ink); }
  .crit { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  .crit li { display: grid; grid-template-columns: 1.6rem 1fr auto; gap: .5rem; padding: .45rem 0; border-bottom: 1px solid var(--grid); font-size: .88rem; align-items: baseline; }
  .crit li:last-child { border-bottom: 0; }
  .crit .mk { font-family: var(--mono); font-size: .72rem; font-weight: 500; }
  .crit .ok { color: var(--good-text); } .crit .no { color: var(--critical); } .crit .na { color: var(--muted); }
  .crit .v { font-family: var(--mono); font-size: .8rem; color: var(--ink-2); text-align: right; white-space: nowrap; }
  .crit .v small { display: block; color: var(--muted); font-size: .7rem; }

  /* ---------- mandates ---------- */
  .chips { display: flex; flex-wrap: wrap; gap: .4rem; }
  .chip { border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: .25rem .7rem; font-size: .8rem; cursor: pointer; color: var(--ink-2); }
  .chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
  .mandats { display: grid; grid-template-columns: 1fr; gap: .75rem; }
  @media (min-width: 44rem) { .mandats { grid-template-columns: 1fr 1fr; } }
  .mandat { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 1rem 1.1rem; display: flex; flex-direction: column; gap: .5rem; }
  .mandat.actif { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .mandat .top { display: flex; justify-content: space-between; gap: .6rem; align-items: baseline; }
  .mandat .fam { font-family: var(--mono); font-size: .68rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
  .mandat .acc { font-size: .92rem; color: var(--ink-2); }
  .mandat .tags { display: flex; flex-wrap: wrap; gap: .3rem; }
  .mandat .tags span { font-size: .72rem; color: var(--ink-2); background: var(--surface-2); border-radius: 3px; padding: .1rem .45rem; }
  .mandat details { font-size: .88rem; color: var(--ink-2); }
  .mandat details summary { cursor: pointer; color: var(--accent); font-size: .85rem; }
  .mandat details > div { display: flex; flex-direction: column; gap: .6rem; margin-top: .6rem; }
  .mandat h4 { margin: 0; font-size: .78rem; font-family: var(--mono); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
  .mandat blockquote { margin: 0; padding: .6rem .8rem; border-left: 3px solid var(--accent); background: var(--surface-2); border-radius: 3px; font-size: .86rem; color: var(--ink); white-space: pre-wrap; }
  .mandat ul { margin: 0; padding-left: 1.1rem; }
  .mandat .risk { display: grid; grid-template-columns: repeat(2, 1fr); gap: .3rem .8rem; font-size: .82rem; }
  .mandat .risk span b { font-family: var(--mono); font-weight: 500; color: var(--ink); }
  .mandat .how { font-size: .8rem; color: var(--muted); }
  .mandat .how code { font-family: var(--mono); font-size: .78rem; background: var(--surface-2); padding: .05em .35em; border-radius: 3px; overflow-wrap: anywhere; }

  /* ---------- events ---------- */
  .events { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; }
  .events li { display: grid; grid-template-columns: auto auto 1fr; gap: .5rem .7rem; padding: .5rem .9rem; border-bottom: 1px solid var(--grid); font-size: .84rem; align-items: baseline; }
  .events li:last-child { border-bottom: 0; }
  .events .lvl { font-family: var(--mono); font-size: .66rem; text-transform: uppercase; letter-spacing: .1em; padding: .1rem .4rem; border-radius: 3px; border: 1px solid var(--border); }
  .events .lvl.critical { border-color: var(--critical); color: var(--critical); }
  .events .lvl.warning { border-color: var(--warning); color: var(--ink); }
  .events .src { font-family: var(--mono); font-size: .76rem; color: var(--muted); }
  .events .ts { grid-column: 1 / -1; font-family: var(--mono); font-size: .7rem; color: var(--muted); }
  @media (min-width: 40rem) { .events li { grid-template-columns: auto auto 1fr auto; } .events .ts { grid-column: auto; } }

  /* ---------- actions ---------- */
  .actions { display: flex; flex-wrap: wrap; gap: .6rem; }
  .btn { display: inline-flex; align-items: center; gap: .4rem; text-decoration: none; border-radius: 6px; padding: .55rem 1rem; font-weight: 500; font-size: .9rem; border: 1px solid var(--border); background: var(--surface); color: var(--ink); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  footer { border-top: 1px solid var(--border); padding-top: 1rem; color: var(--muted); font-size: .82rem; display: flex; flex-direction: column; gap: .5rem; }
  footer .links { display: flex; flex-wrap: wrap; gap: .4rem 1rem; }

  .error { border: 1px solid var(--critical); border-radius: 6px; padding: 1rem; background: var(--surface); font-size: .9rem; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="wrap" id="app">
  <header>
    <div class="titlebar">
      <div>
        <div class="eyebrow">Banc d'essai · Claude trade seul face à un repère</div>
        <h1>Claude trading automatisé</h1>
      </div>
      <button class="theme" id="theme" type="button" aria-label="Changer de thème">Thème : auto</button>
    </div>
    <div class="strip" id="strip"><span class="pill"><span class="dot"></span>chargement des relevés…</span></div>
  </header>
  <div id="banners" style="display:flex;flex-direction:column;gap:.6rem"></div>
  <section id="kpis"></section>
  <section id="equity"></section>
  <section id="exposure"></section>
  <section id="positions"></section>
  <section id="journal"></section>
  <section id="metrics"></section>
  <section id="trades"></section>
  <section id="mandats"></section>
  <section id="fenetres"></section>
  <section id="events"></section>
  <footer id="footer"></footer>
</div>

<script>
(() => {
'use strict';
// ---------------------------------------------------------------- helpers
const $ = (s, r = document) => r.querySelector(s);
function el(tag, attrs = {}, ...children) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k === 'html') e.innerHTML = v;                  // uniquement pour des chaines ecrites ici, jamais des donnees
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'style' && typeof v === 'object') Object.assign(e.style, v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of children.flat(Infinity)) if (c !== null && c !== undefined && c !== false) e.append(c.nodeType ? c : document.createTextNode(String(c)));
  return e;
}
const NS = 'http://www.w3.org/2000/svg';
function svg(tag, attrs = {}, ...children) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) if (v !== null && v !== undefined) e.setAttribute(k, v);
  for (const c of children.flat(Infinity)) if (c) e.append(c.nodeType ? c : document.createTextNode(String(c)));
  return e;
}
const fmt = (n, d = 2) => (n === null || n === undefined || Number.isNaN(n)) ? '—' : Number(n).toLocaleString('fr-FR', { minimumFractionDigits: d, maximumFractionDigits: d });
const pct = (n, d = 2, sign = true) => (n === null || n === undefined || Number.isNaN(n)) ? '—' : (sign && n > 0 ? '+' : '') + fmt(n, d) + ' %';
const pts = (n, d = 2) => (n === null || n === undefined) ? '—' : (n > 0 ? '+' : '') + fmt(n, d) + ' pts';
const dtf = new Intl.DateTimeFormat('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
const dtfLong = new Intl.DateTimeFormat('fr-FR', { weekday: 'short', day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
const fmtDT = (iso) => iso ? dtf.format(new Date(iso)) : '—';
const fmtDTL = (iso) => iso ? dtfLong.format(new Date(iso)) : '—';
function rel(iso) {
  if (!iso) return '—';
  const m = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (m < 1) return "à l'instant";
  if (m < 60) return `il y a ${m} min`;
  const h = Math.floor(m / 60);
  if (h < 48) return `il y a ${h} h${m % 60 ? ' ' + (m % 60) + ' min' : ''}`;
  return `il y a ${Math.floor(h / 24)} j`;
}
function until(iso) {
  if (!iso) return '—';
  const m = Math.round((new Date(iso).getTime() - Date.now()) / 60000);
  if (m <= 0) return 'imminent';
  if (m < 60) return `dans ${m} min`;
  return `dans ${Math.floor(m / 60)} h ${String(m % 60).padStart(2, '0')}`;
}
const sym = (s) => (s || '').split('/')[0];
const BIAS = { up: '↑ hausse', down: '↓ baisse', flat: '→ plat' };
const ACTION = { buy: 'achat', sell: 'vente', hold: 'attente' };

// ---------------------------------------------------------------- theme
const THEMES = ['auto', 'light', 'dark'];

const FILES = ['etat', 'courbes', 'metriques', 'decisions', 'trades', 'evenements', 'mandats', 'fenetres'];
async function load() {
  const t = Date.now(), out = {};

      root.append(svg('text', { x: m.l - 6, y: Y(v) + 4, 'text-anchor': 'end' }, opts.yFmt ? opts.yFmt(v) : fmt(v, 0)));

    root.append(g);
    root.append(svg('g', { class: 'axis' }, svg('line', { x1: m.l, x2: W - m.r, y1: m.t + ph, y2: m.t + ph })));

    const span = x1 - x0, nX = Math.max(2, Math.min(6, Math.floor(pw / 90)));
    const xt = [];

    for (const t of xt) root.append(svg('text', { x: X(t), y: H - 8, 'text-anchor': 'middle' }, span > 3 * 86400e3 ? new Date(t).toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' }) : fmtDT(new Date(t).toISOString())));

    }

      const d = s.points.map((p, i) => (i ? 'L' : 'M') + X(p.t).toFixed(1) + ' ' + Y(p.v).toFixed(1)).join(' ');
      if (opts.area) {

      }

      const last = s.points.at(-1);
      root.append(svg('circle', { cx: X(last.t), cy: Y(last.v), r: 6, fill: cssVar('--surface') }));
      root.append(svg('circle', { cx: X(last.t), cy: Y(last.v), r: 4, fill: color }));
      if (opts.endLabels) root.append(svg('text', { class: 'end-label', x: X(last.t) + 9, y: Y(last.v) + 4 }, opts.yFmt ? opts.yFmt(last.v) : fmt(last.v)));

        tip.append(el('div', { class: 'row' }, el('i', { style: { background: cssVar(s.color) } }), s.name, el('b', { text: opts.yFmt ? opts.yFmt(p.v) : fmt(p.v) })));

    const tb = el('table', {}, el('thead', {}, el('tr', {}, el('th', { text: 'Date' }), ...series.map(s => el('th', { class: 'n', text: s.name })))));
    const body = el('tbody');

    tb.append(body);

  }
}
